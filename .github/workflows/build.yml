name: Build plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake -B build -A x64 -DBAXR_BUILD_TESTS=ON 2>&1 | tee configure.log; exit ${PIPESTATUS[0]}

      - name: Build VST3 and tests
        shell: bash
        run: cmake --build build --config Release --target BAXR_VST3 BAXR_EngineTests BAXR_PluginTests --parallel 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # The build only counts if every DSP and plugin check passes.
      - name: Run tests
        shell: bash
        run: |
          build/Release/BAXR_EngineTests.exe
          build/BAXR_PluginTests_artefacts/Release/BAXR_PluginTests.exe

      # The zipped plugin goes to a "builds" branch (fetched with git) instead of
      # Actions artifacts, so it never counts against the artifact storage quota.
      - name: Publish VST3 to builds branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir out
          cd build/BAXR_artefacts/Release/VST3
          7z a -tzip "$GITHUB_WORKSPACE/out/BAXR-VST3-Windows-x64.zip" "BAXR.vst3"
          cd "$GITHUB_WORKSPACE/out"
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -qm "Plugin builds ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds

      - name: Upload logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          retention-days: 3
          path: |
            configure.log
            build.log
            build/CMakeFiles/CMakeConfigureLog.yaml
